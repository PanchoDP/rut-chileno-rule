name: Tests_Rut_chileno_rule

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - php-version: '8.4'
            testbench: '^8.0'
            pest: '^2.0'
            laravel: '10'
          - php-version: '8.4'
            testbench: '^9.0'
            pest: '^3.0'
            laravel: '11'
          - php-version: '8.4'
            testbench: '^10.0'
            pest: '^3.0'
            laravel: '12'
          - php-version: '8.4'
            testbench: '^11.0'
            pest: '^4.0'
            laravel: '13'
          - php-version: '8.5'
            testbench: '^11.0'
            pest: '^4.0'
            laravel: '13'

    name: Laravel ${{ matrix.laravel }} / PHP ${{ matrix.php-version }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
        coverage: none
        tools: composer:2.9.8

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v3
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ matrix.php-version }}-laravel-${{ matrix.laravel }}-${{ hashFiles('**/composer.json') }}
        restore-keys: |
          ${{ runner.os }}-php-${{ matrix.php-version }}-laravel-${{ matrix.laravel }}-

    - name: Install dependencies
      run: |
        composer update \
          --with "orchestra/testbench:${{ matrix.testbench }}" \
          --with "pestphp/pest:${{ matrix.pest }}" \
          --prefer-dist \
          --no-progress \
          --no-interaction

    - name: Run tests
      run: composer test

    - name: Run code formatting check
      run: composer pint

    - name: Run static analysis
      run: composer analyze